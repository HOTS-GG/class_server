<!DOCTYPE html>
<html lang="ko" data-no-scale>
<head>
<meta charset="utf-8">
<title>교실 평가 시스템 — 세이브 파일 선택</title>
<link rel="stylesheet" href="../../shared/theme.css">
<script src="../../shared/theme.js"></script>
<style>
  /* 고정 720×720 창. 배율(zoom) 미적용, 스크롤 없이 한 화면에 맞춘다. */
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; padding: 24px 28px; box-sizing: border-box; }
  .top { display: flex; align-items: flex-start; gap: 12px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .lead { color: var(--tx-3); margin: 0; font-size: 13px; line-height: 1.5; }
  .actions { display: flex; gap: 10px; margin: 16px 0 14px; }
  .actions button { font-size: 15px; padding: 12px 18px; flex: 1; }
  h2 { font-size: 14px; color: var(--tx-2); margin: 0 0 8px; }
  .recent { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;
    border: 1px solid var(--bd-1); border-radius: 12px; padding: 8px; background: var(--bg-0); }
  .item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--bd-1);
    border-radius: 10px; background: var(--bg-2); cursor: pointer; }
  .item:hover { background: var(--bg-hover); }
  .item .name { font-weight: 700; font-size: 15px; }
  .item .path { font-size: 12px; color: var(--tx-4); word-break: break-all; }
  .item .grow { flex: 1; min-width: 0; }
  .item.missing { opacity: .6; }
  .status { min-height: 40px; font-size: 14px; color: var(--clr-red-text); margin-top: 10px; white-space: pre-wrap; }
  .status.ok { color: var(--tx-3); }
  .foot { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: var(--tx-4); }
</style>
</head>
<body>
  <div class="top">
    <div style="flex:1">
      <h1>교실 평가 시스템</h1>
      <p class="lead">세이브 파일을 열어야 시작할 수 있습니다. 세이브 파일에는 학생 명단·과목·과제·시험·채점 결과·설정이 저장되고,
        첨부 파일은 같은 위치의 <code>이름.files</code> 폴더에 저장됩니다.</p>
    </div>
    <button class="theme-toggle" data-theme-toggle title="테마 전환">🌙</button>
  </div>
  <div class="actions">
    <button id="btn-new" class="primary">＋ 새 세이브 만들기</button>
    <button id="btn-open">📂 세이브 파일 열기 (.classdb)</button>
  </div>
  <h2>최근 세이브</h2>
  <div id="recent" class="recent"><span class="muted">최근에 연 세이브가 없습니다.</span></div>
  <div id="status" class="status"></div>
  <div class="foot"><span>✕ 는 목록에서만 제거하며 파일은 삭제되지 않습니다.</span><span class="sep"></span><span id="ver"></span></div>
<script>
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = (ts) => ts ? new Date(ts).toLocaleString('ko-KR') : '';
  let busy = false;

  function setStatus(msg, ok = false) {
    const el = $('#status');
    el.textContent = msg ?? '';
    el.classList.toggle('ok', ok);
  }

  async function loadRecent() {
    const list = await window.startApi.getRecent();
    const box = $('#recent');
    if (!list.length) { box.innerHTML = '<span class="muted">최근에 연 세이브가 없습니다. 위에서 새로 만들거나 열어 주세요.</span>'; return; }
    box.innerHTML = list.map((r) => `
      <div class="item ${r.exists ? '' : 'missing'}" data-file="${esc(r.file)}">
        <div class="grow">
          <div class="name">${esc(r.name)} ${r.legacy ? '<span class="pill">이전 버전 데이터</span>' : ''} ${r.exists ? '' : '<span class="pill off">파일 없음</span>'}</div>
          <div class="path">${esc(r.file)}${r.lastOpened ? ` · ${fmt(r.lastOpened)}` : ''}</div>
        </div>
        <button class="small" data-restore="${esc(r.file)}" title="백업에서 되돌리기">복구</button>
        <button class="small" data-forget="${esc(r.file)}" title="목록에서 제거 (파일은 삭제되지 않음)">✕</button>
      </div>`).join('');
  }

  // 백업 복구: 이 세이브의 백업 폴더 목록을 보여 주고 고르면 세이브를 그 사본으로 되돌린다
  async function openRestore(file) {
    const list = await window.startApi.backups(file);
    if (!list.length) { setStatus('이 세이브에는 아직 백업이 없습니다. 세이브를 열면 시험 시작·종료 때와 하루 한 번 자동으로 만들어집니다.'); return; }
    const reasonKo = { manual: '수동', daily: '일일', 'exam-start': '시험 시작', 'exam-end': '시험 종료' };
    const box = $('#recent');
    box.innerHTML = `<div class="item" style="cursor:default;background:var(--bg-2)"><div class="grow"><div class="name">백업에서 복구 — ${esc(file.split(/[\\/]/).pop())}</div>
        <div class="path">고르면 현재 세이브를 그 시점으로 되돌립니다. 되돌리기 전 현재 파일은 .before-restore 사본으로 남습니다.</div></div>
        <button class="small" id="btn-restore-cancel">취소</button></div>` +
      list.map((b) => `<div class="item" data-restore-path="${esc(b.path)}" data-file="${esc(file)}">
        <div class="grow"><div class="name">${esc(b.when)} <span class="pill">${esc(reasonKo[b.reason] ?? b.reason)}</span></div>
        <div class="path">${esc(b.name)} · ${Math.max(1, Math.round(b.size / 1024))}KB</div></div></div>`).join('');
    $('#btn-restore-cancel').addEventListener('click', loadRecent);
  }

  async function openFile(file) {
    if (busy) return;
    busy = true;
    setStatus('여는 중…', true);
    const r = await window.startApi.open(file);
    if (!r.ok) { setStatus(r.error); busy = false; }
  }

  $('#btn-new').addEventListener('click', async () => {
    const file = await window.startApi.chooseNew();
    if (file) openFile(file);
  });
  $('#btn-open').addEventListener('click', async () => {
    const file = await window.startApi.chooseOpen();
    if (file) openFile(file);
  });
  $('#recent').addEventListener('click', async (e) => {
    const forget = e.target.closest('button[data-forget]');
    if (forget) { await window.startApi.forget(forget.dataset.forget); await loadRecent(); return; }
    const restoreBtn = e.target.closest('button[data-restore]');
    if (restoreBtn) { await openRestore(restoreBtn.dataset.restore); return; }
    const pick = e.target.closest('.item[data-restore-path]');
    if (pick) {
      setStatus('복구 중…', true);
      const r = await window.startApi.restore(pick.dataset.file, pick.dataset.restorePath);
      if (!r.ok) { setStatus(r.error); return; }
      setStatus('복구했습니다. 세이브를 엽니다…', true);
      openFile(pick.dataset.file);
      return;
    }
    const item = e.target.closest('.item[data-file]');
    if (item && !item.dataset.restorePath) openFile(item.dataset.file);
  });
  window.startApi.onStatus((p) => { setStatus(p.message, p.ok); if (!p.ok) busy = false; });
  window.startApi.version?.().then((v) => { $('#ver').textContent = v ? `v${v}` : ''; });
  loadRecent();
</script>
</body>
</html>
