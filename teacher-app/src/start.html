<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>교실 평가 시스템 — 세이브 파일 선택</title>
<link rel="stylesheet" href="../../shared/theme.css">
<script src="../../shared/theme.js"></script>
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .wrap { width: min(640px, 94vw); background: var(--bg-2); border: 1px solid var(--bd-1); border-radius: 16px;
    padding: 28px 32px; box-shadow: 0 10px 40px var(--shadow); }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .lead { color: var(--tx-3); margin: 0 0 18px; font-size: 14px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .actions button { font-size: 15px; padding: 12px 18px; }
  h2 { font-size: 14px; color: var(--tx-2); margin: 16px 0 8px; }
  .recent { display: flex; flex-direction: column; gap: 6px; max-height: 300px; overflow-y: auto; }
  .item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--bd-1);
    border-radius: 10px; background: var(--bg-1); cursor: pointer; }
  .item:hover { background: var(--bg-hover); }
  .item .name { font-weight: 700; font-size: 15px; }
  .item .path { font-size: 12px; color: var(--tx-4); word-break: break-all; }
  .item .grow { flex: 1; min-width: 0; }
  .item.missing { opacity: .6; }
  .status { min-height: 22px; font-size: 14px; color: var(--clr-red-text); margin-top: 12px; white-space: pre-wrap; }
  .status.ok { color: var(--tx-3); }
  .foot { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>교실 평가 시스템</h1>
  <p class="lead">세이브 파일을 열어야 시작할 수 있습니다. 세이브 파일에는 학생 명단·과목·과제·시험·채점 결과·설정이 저장되고,
    첨부 파일(배부 자료·제출물·답안 첨부)은 같은 위치의 <code>이름.files</code> 폴더에 저장됩니다.</p>
  <div class="actions">
    <button id="btn-new" class="primary">＋ 새 세이브 만들기</button>
    <button id="btn-open">📂 세이브 파일 열기 (.classdb)</button>
  </div>
  <h2>최근 세이브</h2>
  <div id="recent" class="recent"><span class="muted">최근에 연 세이브가 없습니다.</span></div>
  <div id="status" class="status"></div>
  <div class="foot">
    <span class="sep"></span>
    <label class="muted" style="display:inline-flex;align-items:center;gap:4px">🔍 <select data-scale-select></select></label>
    <button class="theme-toggle" data-theme-toggle title="테마 전환">🌙</button>
  </div>
</div>
<script>
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = (ts) => ts ? new Date(ts).toLocaleString('ko-KR') : '';
  let busy = false;

  function setStatus(msg, ok = false) {
    const el = $('#status');
    el.textContent = msg ?? '';
    el.classList.toggle('ok', ok);
  }

  async function loadRecent() {
    const list = await window.startApi.getRecent();
    const box = $('#recent');
    if (!list.length) { box.innerHTML = '<span class="muted">최근에 연 세이브가 없습니다.</span>'; return; }
    box.innerHTML = list.map((r) => `
      <div class="item ${r.exists ? '' : 'missing'}" data-file="${esc(r.file)}">
        <div class="grow">
          <div class="name">${esc(r.name)} ${r.legacy ? '<span class="pill">이전 버전 데이터</span>' : ''} ${r.exists ? '' : '<span class="pill off">파일 없음</span>'}</div>
          <div class="path">${esc(r.file)}${r.lastOpened ? ` · ${fmt(r.lastOpened)}` : ''}</div>
        </div>
        <button class="small" data-forget="${esc(r.file)}" title="목록에서 제거 (파일은 삭제되지 않음)">✕</button>
      </div>`).join('');
  }

  async function openFile(file) {
    if (busy) return;
    busy = true;
    setStatus('여는 중…', true);
    const r = await window.startApi.open(file);
    if (!r.ok) { setStatus(r.error); busy = false; }
  }

  $('#btn-new').addEventListener('click', async () => {
    const file = await window.startApi.chooseNew();
    if (file) openFile(file);
  });
  $('#btn-open').addEventListener('click', async () => {
    const file = await window.startApi.chooseOpen();
    if (file) openFile(file);
  });
  $('#recent').addEventListener('click', async (e) => {
    const forget = e.target.closest('button[data-forget]');
    if (forget) { await window.startApi.forget(forget.dataset.forget); await loadRecent(); return; }
    const item = e.target.closest('.item');
    if (item) openFile(item.dataset.file);
  });
  window.startApi.onStatus((p) => { setStatus(p.message, p.ok); if (!p.ok) busy = false; });
  loadRecent();
</script>
</body>
</html>
