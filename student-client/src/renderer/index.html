<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>수업 클라이언트</title>
<link rel="stylesheet" href="../../../shared/theme.css">
<link rel="stylesheet" href="style.css">
<script src="../../../shared/theme.js"></script>
<script src="../../../shared/dialog.js"></script>
</head>
<body>

<!-- 접속 화면 -->
<section id="screen-connect" class="screen active">
  <div class="center-card">
    <div class="row"><h1>수업 참여하기</h1><span class="sep"></span>
      <label class="scale-ctl" title="화면 크기">🔍 <select data-scale-select></select></label>
      <button class="theme-toggle" data-theme-toggle title="테마 전환">🌙</button></div>
    <label>선생님 컴퓨터 주소
      <div class="row">
        <input id="in-server" type="text" placeholder="예: 192.168.0.10">
        <button id="btn-discover">자동 찾기</button>
      </div>
    </label>
    <label>내 접속 코드
      <input id="in-code" type="text" placeholder="접속 코드 6자리" maxlength="6" autocapitalize="characters">
    </label>
    <button id="btn-join" class="primary big">접속</button>
    <p id="connect-msg" class="msg"></p>
  </div>
</section>

<!-- 홈 화면 -->
<section id="screen-home" class="screen">
  <header>
    <span id="home-student"></span>
    <button id="conn-status" class="pill on" title="연결 상태 보기">연결됨</button>
    <span class="sep"></span>
    <label class="scale-ctl" title="화면 크기">🔍 <select data-scale-select></select></label>
    <button class="theme-toggle" data-theme-toggle title="테마 전환">🌙</button>
    <button id="btn-logout" class="small" title="다른 학생이 이 PC에서 접속할 수 있도록 로그아웃합니다">로그아웃</button>
    <button id="btn-exit" class="small">종료</button>
  </header>
  <nav class="home-tabs">
    <button data-home-tab="assignments" class="active">📁 과제 <span id="asg-count" class="count"></span></button>
    <button data-home-tab="exams">📝 시험 <span id="exam-count" class="count"></span></button>
  </nav>
  <div id="exam-notice" class="notice hidden"></div>

  <div id="home-assignments" class="home-tab active">
    <div id="assignment-list"><p class="muted">과제를 불러오는 중...</p></div>
  </div>

  <div id="home-exams" class="home-tab">
    <div id="exam-active-card"></div>
    <h2>시험 결과</h2>
    <div id="result-list"><p class="muted">공개된 시험 결과가 없습니다.</p></div>
  </div>
</section>

<!-- 시험 결과 상세 화면 -->
<section id="screen-result" class="screen">
  <header>
    <button id="btn-result-back" class="small">← 돌아가기</button>
    <b id="result-title"></b>
    <span class="sep"></span>
    <span id="result-total" class="result-total"></span>
  </header>
  <div id="result-content" class="result-content"></div>
</section>

<!-- 시험 화면 -->
<section id="screen-exam" class="screen">
  <header class="exam-header">
    <b id="exam-title"></b>
    <span id="exam-timer" class="timer"></span>
    <span class="sep"></span>
    <span id="save-status" class="muted"></span>
    <button id="btn-submit-exam" class="primary">제출하기</button>
  </header>
  <div id="exam-progress" class="progress-nav"></div>
  <div class="exam-body">
    <div id="exam-questions"></div>
    <aside id="omr-panel"></aside>
  </div>
  <div class="exam-footer">
    <button id="btn-submit-exam2" class="primary big">시험 제출하기</button>
  </div>
</section>

<!-- 완료/대기 화면 -->
<section id="screen-done" class="screen">
  <div class="center-card">
    <h1 id="done-title"></h1>
    <p id="done-msg"></p>
    <button id="btn-done-home" class="primary">확인</button>
  </div>
</section>

<!-- 종료(잠금 해제) 모달 -->
<div id="unlock-modal" class="modal hidden">
  <div class="modal-body">
    <h2>프로그램 종료</h2>
    <p>시험 중에는 종료할 수 없습니다. 선생님께 받은 해제 코드를 입력하세요.</p>
    <input id="in-unlock" type="text" placeholder="해제 코드" maxlength="4" autocapitalize="characters">
    <p id="unlock-msg" class="msg"></p>
    <div class="row">
      <button id="btn-unlock-ok" class="primary">확인</button>
      <button id="btn-unlock-cancel">취소</button>
    </div>
  </div>
</div>

<!-- 연결 상태 모달 -->
<div id="conn-modal" class="modal hidden">
  <div class="modal-body" style="width:min(460px,92vw)">
    <h2 style="margin-top:0">연결 상태</h2>
    <table class="conn-table"><tbody id="conn-table"></tbody></table>
    <div class="row" style="margin-top:12px">
      <button id="btn-conn-refresh">다시 확인</button>
      <span class="sep"></span>
      <button id="btn-conn-close" class="primary">닫기</button>
    </div>
  </div>
</div>

<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
